<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UMAR_KHAN.OS // boot</title>
<meta name="description" content="Mohd. Umar Khan — interactive gamified portfolio. Cybersecurity, AI agents, full-stack development." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#04070a;
    --term:#0affa0;
    --term-dim:#0a8f5e;
    --amber:#ffb000;
    --cyan:#22d3ee;
    --red:#ff4d5e;
    --fg:#c8ffe6;
    --glow:0 0 8px rgba(10,255,160,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--term);
    font-family:'JetBrains Mono',monospace;
    overflow:hidden;position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px,rgba(0,0,0,.18) 3px);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);
    animation:flicker 4s infinite;
  }
  @keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.82}94%{opacity:1}97%{opacity:.9}98%{opacity:1}}

  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.active{display:flex}

  #boot{padding:28px 32px;justify-content:flex-start;overflow:hidden}
  #console{
    font-size:14px;line-height:1.5;text-shadow:var(--glow);
    white-space:pre-wrap;flex:1;overflow:hidden;
  }
  #console .ok{color:var(--term)}
  #console .warn{color:var(--amber)}
  #console .err{color:var(--red)}
  #console .dim{color:var(--term-dim)}
  #console .cyan{color:var(--cyan)}
  #console .hl{color:#eafff6;text-shadow:0 0 10px rgba(10,255,160,.9)}

  #progwrap{margin-top:18px;font-size:14px;display:none}
  #progwrap.show{display:block}
  .bar{border:1px solid var(--term-dim);height:22px;width:min(520px,80vw);
    padding:3px;border-radius:2px;box-shadow:var(--glow);position:relative}
  .bar > i{display:block;height:100%;width:0;background:
    repeating-linear-gradient(90deg,var(--term) 0,var(--term) 8px,transparent 8px,transparent 12px);
    transition:width .18s linear;box-shadow:var(--glow)}
  #progtxt{margin-top:8px;color:var(--term-dim);font-size:13px}

  #enterwrap{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:26px;
    background:radial-gradient(ellipse at center,rgba(4,7,10,.4),rgba(4,7,10,.92));
  }
  #enterwrap.show{display:flex;animation:fadein .8s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .title-ascii{font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(30px,8vw,74px);letter-spacing:.06em;color:#eafff6;
    text-shadow:0 0 18px rgba(10,255,160,.8),0 0 40px rgba(10,255,160,.4);line-height:1}
  .subtitle{color:var(--cyan);font-size:clamp(12px,2vw,16px);letter-spacing:.3em;text-transform:uppercase;text-shadow:0 0 10px rgba(34,211,238,.6)}
  .enter-btn{
    margin-top:10px;font-family:'Orbitron',sans-serif;font-weight:700;
    font-size:clamp(16px,2.5vw,22px);letter-spacing:.18em;color:var(--bg);
    background:var(--term);border:none;padding:16px 46px;cursor:pointer;
    border-radius:3px;box-shadow:0 0 24px rgba(10,255,160,.7);
    animation:pulse 1.6s ease-in-out infinite;transition:transform .15s}
  .enter-btn:hover{transform:scale(1.06)}
  @keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(10,255,160,.5)}50%{box-shadow:0 0 40px rgba(10,255,160,1)}}
  .hint{color:var(--term-dim);font-size:12px;letter-spacing:.2em}

  #skip{position:absolute;bottom:20px;right:26px;color:var(--term-dim);
    font-size:12px;letter-spacing:.15em;cursor:pointer;z-index:10;background:none;border:none;font-family:inherit}
  #skip:hover{color:var(--term)}

  /* ---------- CENTERED TRANSPARENT LOADING BAR OVERLAY ---------- */
  #centerload{
    position:absolute;inset:0;z-index:8;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    gap:16px;pointer-events:none;padding:24px;
    background:radial-gradient(ellipse at center,rgba(4,7,10,.35),rgba(4,7,10,.15));
  }
  #centerload.hide{display:none}
  #centerload .cl-label{
    font-family:'Orbitron',sans-serif;letter-spacing:.28em;text-transform:uppercase;
    font-size:clamp(12px,1.8vw,15px);color:var(--cyan);
    text-shadow:0 0 10px rgba(34,211,238,.5);opacity:.9}
  .cl-bar{
    width:min(560px,82vw);height:30px;border-radius:6px;
    border:1px solid rgba(10,255,160,.35);
    background:rgba(10,255,160,.05);
    box-shadow:0 0 18px rgba(10,255,160,.15),inset 0 0 12px rgba(0,0,0,.4);
    padding:4px;position:relative;overflow:hidden;backdrop-filter:blur(2px)}
  .cl-bar > i{
    display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,rgba(10,255,160,.55),rgba(34,211,238,.75));
    box-shadow:0 0 16px rgba(10,255,160,.6);transition:width .12s linear}
  /* moving shine sweep */
  .cl-bar > i::after{
    content:"";position:absolute;top:0;left:0;height:100%;width:60px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    animation:sweep 1.4s linear infinite}
  @keyframes sweep{0%{transform:translateX(-60px)}100%{transform:translateX(min(560px,82vw))}}
  #centerpct{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--fg);
    letter-spacing:.15em;opacity:.85;text-shadow:var(--glow)}

  #home{align-items:center;justify-content:center;text-align:center;gap:22px;padding:30px}
  #home .h-card{border:1px solid var(--term-dim);border-radius:6px;padding:34px 40px;max-width:560px;box-shadow:var(--glow);background:rgba(10,255,160,.03)}
  #home img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--term);box-shadow:var(--glow);margin-bottom:16px}
  #home h1{font-family:'Orbitron',sans-serif;font-size:26px;letter-spacing:.05em;color:#eafff6;text-shadow:var(--glow)}
  #home .role{color:var(--cyan);letter-spacing:.2em;text-transform:uppercase;font-size:13px;margin-top:6px}
  #home .note{color:var(--term-dim);font-size:13px;margin-top:22px;line-height:1.7}
  #home .note b{color:var(--amber)}
</style>
</head>
<body>

<section id="boot" class="screen active">
  <div id="console"></div>

  <!-- Centered transparent loading bar (fills over the whole boot) -->
  <div id="centerload">
    <div class="cl-label" id="clLabel">Initializing System</div>
    <div class="cl-bar"><i id="clFill"></i></div>
    <div id="centerpct">0%</div>
  </div>

  <div id="progwrap">
    <div class="bar"><i id="barfill"></i></div>
    <div id="progtxt">0%</div>
  </div>
  <div id="enterwrap">
    <div class="subtitle">System Ready</div>
    <div class="title-ascii">UMAR&nbsp;KHAN</div>
    <div class="subtitle">Interactive&nbsp;Portfolio&nbsp;// OS</div>
    <button class="enter-btn" id="enterBtn">▶ ENTER</button>
    <div class="hint">[ press ENTER or click ]</div>
  </div>
  <button id="skip">SKIP &gt;&gt;</button>
</section>

<section id="home" class="screen">
  <div class="h-card">
    <img src="assets/umar.jpg" alt="Umar Khan" />
    <h1>MOHD. UMAR KHAN</h1>
    <div class="role">Cybersecurity · AI · Full-Stack</div>
    <div class="note">
      &gt; BOOT SEQUENCE COMPLETE.<br/>
      This is a placeholder home screen.<br/>
      <b>Next step:</b> we build the game-style main menu &amp; the first mini-game.
    </div>
  </div>
</section>

<script>
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

const consoleEl = document.getElementById('console');
const progwrap  = document.getElementById('progwrap');
const barfill   = document.getElementById('barfill');
const progtxt   = document.getElementById('progtxt');
const enterwrap = document.getElementById('enterwrap');
const centerload= document.getElementById('centerload');
const clFill    = document.getElementById('clFill');
const clLabel   = document.getElementById('clLabel');
const centerpct = document.getElementById('centerpct');
let booted = false, skipped = false;

function setCenter(pct,label){
  pct=Math.max(0,Math.min(100,Math.round(pct)));
  clFill.style.width=pct+'%';
  centerpct.textContent=pct+'%';
  if(label) clLabel.textContent=label;
}

const t = (s)=>new Promise(r=>setTimeout(r, skipped?0:s));

const lines = [
  ['UMAR_KHAN.OS  v2.0.5   (c) 2026  Dubai, UAE','hl',260],
  ['BIOS check ................................. <span class="ok">[  OK  ]</span>','',120],
  ['Mounting /dev/portfolio ................... <span class="ok">[  OK  ]</span>','',120],
  ['Loading kernel modules ....................','dim',180],
  ['  &gt; module: cybersecurity.ko ............ <span class="ok">[ LOAD ]</span>','',90],
  ['  &gt; module: ai_agents.ko ............... <span class="ok">[ LOAD ]</span>','',90],
  ['  &gt; module: fullstack_dev.ko ........... <span class="ok">[ LOAD ]</span>','',90],
  ['  &gt; module: automation_rpa.ko .......... <span class="ok">[ LOAD ]</span>','',90],
  ['  &gt; module: it_support.ko .............. <span class="ok">[ LOAD ]</span>','',90],
  ['Initializing neural interface .............','dim',200],
  ['  &gt; LLM runtime (2B params) ............ <span class="ok">[ READY ]</span>','',110],
  ['  &gt; Claude API link ................... <span class="cyan">[ ONLINE ]</span>','',110],
  ['Scanning skill database ................... <span class="ok">[  OK  ]</span>','',140],
  ['Establishing secure connection ...........','dim',180],
  ['  &gt; firewall ......................... <span class="ok">[ ACTIVE ]</span>','',90],
  ['  &gt; encryption AES-256 ............... <span class="ok">[  ON  ]</span>','',90],
  ['WARNING: player skill level = <span class="hl">HIGH</span> ......... <span class="warn">[ !! ]</span>','',160],
  ['Loading operator profile: <span class="hl">MOHD. UMAR KHAN</span>','',180],
  ['Compiling game engine .....................','dim',220],
];

async function typeLine(html){
  const div=document.createElement('div');
  div.innerHTML=html;
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

async function runBoot(){
  const total = lines.length;
  let idx = 0;
  const phaseLabels = ['Initializing System','Loading Modules','Neural Interface','Securing Channel','Compiling Engine'];
  for(const [html,cls,delay] of lines){
    if(booted) return;
    const wrapped = cls ? `<span class="${cls}">${html}</span>` : html;
    await typeLine(wrapped);
    idx++;
    // center bar climbs 0 -> 78% across the log phase
    setCenter((idx/total)*78, phaseLabels[Math.min(phaseLabels.length-1, Math.floor((idx/total)*phaseLabels.length))]);
    await t(delay);
  }
  progwrap.classList.add('show');
  const steps = ['allocating memory','decrypting assets','rendering UI','calibrating input','finalizing'];
  for(let p=0;p<=100;p+=2){
    if(booted) return;
    barfill.style.width=p+'%';
    const label = steps[Math.min(steps.length-1, Math.floor(p/20))];
    progtxt.textContent = p+'%  ::  '+label;
    // center bar finishes the last 22%
    setCenter(78 + (p/100)*22, 'Finalizing');
    await t(24);
  }
  setCenter(100,'Boot Complete');
  progtxt.innerHTML='100%  ::  <span class="ok">boot complete</span>';
  await t(400);
  finishBoot();
}

function finishBoot(){
  if(booted) return;
  booted=true;
  setCenter(100,'Boot Complete');
  centerload.classList.add('hide');
  enterwrap.classList.add('show');
}

function enter(){ show('home'); }

document.getElementById('enterBtn').addEventListener('click', enter);
document.getElementById('skip').addEventListener('click', ()=>{ skipped=true; finishBoot(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    if(!booted){ skipped=true; finishBoot(); }
    else enter();
  }
});

runBoot();
</script>
</body>
</html>
